deployment:
  secrecy_probability:
    dist: fixed
    value: 0.25
    units: probability
    sources: [EO14409_2026_06, ANTH_MYTHOS51_SC_2026_09, OAI_ASTRA_SC_2026_09]
    evidence_class: [EMPIRICAL_CAPABILITY_RESULT, AUTHOR_PRIOR]
    interpretation: "P(internal ASI is withheld/classified rather than released through the normal staged process)."
    rationale: "Mythos-class models already restricted to vetted partners for months; EO 14409 lets the state pick trusted partners; NSPM-11 prioritises national-security use."
    correlation_group: governance
    last_updated: "2026-10-06"
  normal_delay_months:
    dist: lognormal
    median: 4
    p95: 12
    clip: [0.5, 48]
    latent_loading: -0.2
    units: months from internal ASI to public availability/observability
    sources: [ANTH_MYTHOS_PREVIEW_SC_2026_04, ANTH_MYTHOS5_SC_2026_06, OAI_ASTRA_SC_2026_09, EO14409_2026_06]
    evidence_class: [EMPIRICAL_CAPABILITY_RESULT]
    interpretation: "Staged release: government window, trusted partners, safeguarded public variant."
    rationale: "Mythos Preview: internal 24 Feb -> partners 7 Apr -> safeguarded public (Fable 5) 9 Jun 2026 (~3.5 months). GPT-6 Astra: internal Aug -> limited preview 3 Sep. EO 14409 voluntary 30-day federal window."
    correlation_group: governance
    last_updated: "2026-10-06"
  secrecy_delay_months:
    dist: lognormal
    median: 18
    p95: 60
    clip: [3, 240]
    latent_loading: 0.0
    units: months
    sources: [EO14409_2026_06]
    evidence_class: [AUTHOR_PRIOR]
    interpretation: "Delay when ASI is held for national-security reasons."
    rationale: "No precedent; wide judgement distribution."
    correlation_group: governance
    last_updated: "2026-10-06"

# -----------------------------------------------------------------------------
# Scenarios (deep-merged over the baseline). Run with --scenario <name>.
# -----------------------------------------------------------------------------
scenarios:
  baseline:
    description: "A — evidence-weighted posterior (regime weights from the Bayesian update)."
  agi_era_fast:
    description: >
      B — conditional on current systems being near AGI, high AI-R&D automation,
      strong successor feedback and infrastructure keeping pace.
    overrides:
      agi_status: {p_already_agi: {value: 0.35}}
      agi_stage:
        current_horizon_hours: {median: 45}
        doubling_months: {median: 3.5, p95: 5.5}
        per_doubling_ratio: {low: 0.82, mode: 0.92, high: 1.0}
        agi_threshold_hours: {median: 500, p95: 3000}
        paradigm_wall_probability: {value: 0.03}
      progress_inputs:
        compute_slowdown_year: {low: 2030.0, high: 2033.0}
        compute_late_multiplier: {low: 0.75, mode: 0.9, high: 1.0}
      takeoff:
        post_agi_pause_probability: {value: 0.2}
        regime_weights_override: {bottlenecked: 0.0, moderate: 0.2, fast: 0.5, recursive: 0.3}
  bottlenecked:
    description: >
      C — conditional on weak autonomous research, reliability failures, diminishing
      returns, hardware/energy constraints and governance/deployment delays.
    overrides:
      agi_status: {p_already_agi: {value: 0.0}}
      agi_stage:
        current_horizon_hours: {median: 24}
        doubling_months: {median: 6.5, p95: 11}
        per_doubling_ratio: {low: 0.95, mode: 1.0, high: 1.12}
        agi_threshold_hours: {median: 2500, p95: 15000}
        paradigm_wall_probability: {value: 0.25}
        pre_agi_pause_probability: {value: 0.3}
      progress_inputs:
        compute_slowdown_year: {low: 2027.5, high: 2029.0}
        compute_late_multiplier: {low: 0.3, mode: 0.5, high: 0.75}
      takeoff:
        post_agi_pause_probability: {value: 0.5}
        post_agi_pause_months: {median: 6, p95: 24}
        regime_weights_override: {bottlenecked: 0.6, moderate: 0.4, fast: 0.0, recursive: 0.0}
      deployment:
        secrecy_probability: {value: 0.4}
